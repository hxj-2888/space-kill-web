<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080A0F">
<meta name="description" content="《新返航录》网页试玩版 · 返航录V3——11 人类 vs 4 异形的实时太空船对抗游戏，可旁观">
<title>新返航录 · 返航录V3</title>
<style>
  html,body{margin:0;height:100%;background:#080A0F;overflow:hidden;
    font-family:system-ui,"Microsoft YaHei",sans-serif;color:#DDE3EC}

  /* ---------------- 主页：船体即主视觉 ---------------- */
  #pick{position:fixed;inset:0;z-index:20;display:grid;
    grid-template-columns:minmax(330px,40%) 1fr;background:#05070B}
  #pick .panel{position:relative;z-index:3;display:flex;flex-direction:column;justify-content:center;
    gap:clamp(10px,1.6vh,20px);padding:clamp(18px,3vh,34px) clamp(18px,2.4vw,32px);
    overflow:auto;border-right:1px solid #232C39;
    background:linear-gradient(90deg,#080B11 62%,rgba(8,11,17,.74) 88%,transparent)}
  #pick .brand{display:flex;flex-direction:column;gap:8px}
  #pick .mark{display:flex;align-items:center;gap:9px;font-size:10.5px;letter-spacing:3px;color:#7C8798}
  #pick .mark i{width:7px;height:7px;border-radius:50%;background:#F0C674;
    box-shadow:0 0 10px #F0C674;animation:hpulse 2.6s ease-in-out infinite}
  @keyframes hpulse{0%,100%{opacity:.45}50%{opacity:1}}
  #pick h1{font-size:clamp(24px,3vw,36px);font-weight:500;letter-spacing:9px;color:#F0C674;
    line-height:1.15;margin:0}
  #pick .sub{font-size:12px;line-height:1.85;color:#7C8798;max-width:33em;margin:0}
  #pick .sub b{color:#A9B6C6;font-weight:500}
  #pick .roles{display:flex;flex-direction:column;gap:7px}
  #pick .role{display:grid;grid-template-columns:12px 1fr auto;align-items:center;gap:11px;
    padding:clamp(8px,1.2vh,12px) 13px;border:1px solid #232C39;border-radius:11px;
    background:rgba(13,18,26,.86);cursor:pointer;transition:.18s;text-align:left;
    font:inherit;color:inherit}
  #pick .role:hover,#pick .role.sel{border-color:var(--acc);background:#111A24;transform:translateX(4px)}
  #pick .role .dot{width:9px;height:9px;border-radius:50%;background:var(--acc);opacity:.55;
    transition:.18s}
  #pick .role:hover .dot,#pick .role.sel .dot{opacity:1;box-shadow:0 0 12px var(--acc)}
  #pick .role b{display:block;font-size:13.5px;font-weight:500;letter-spacing:1px;color:var(--acc)}
  #pick .role span{display:block;font-size:10.5px;color:#7C8798;line-height:1.55;margin-top:2px}
  #pick .role .where{font-size:10px;color:#55606F;white-space:nowrap}
  #pick .cta{display:flex;gap:9px;align-items:center}
  #pick .go{flex:1;padding:clamp(10px,1.4vh,13px) 14px;border-radius:11px;border:1px solid #F0C674;
    background:linear-gradient(180deg,#2A2416,#1B1710);color:#F0C674;
    font:500 13.5px/1 inherit;letter-spacing:4px;cursor:pointer;transition:.18s}
  #pick .go:hover{background:linear-gradient(180deg,#3A3018,#241D12);
    box-shadow:0 6px 22px rgba(240,198,116,.16)}
  #pick .ghost{padding:clamp(10px,1.4vh,13px) 13px;border-radius:11px;border:1px solid #232C39;
    background:rgba(13,18,26,.86);color:#DDE3EC;font:12px/1 inherit;cursor:pointer;transition:.18s}
  #pick .ghost:hover{border-color:#43536B;background:#18202B}
  #pick .stats{display:flex;flex-wrap:wrap;gap:6px}
  #pick .chip{display:flex;align-items:baseline;gap:5px;padding:4px 9px;border:1px solid #232C39;
    border-radius:20px;background:rgba(12,17,24,.7);font-size:10px;color:#7C8798}
  #pick .chip b{font-size:12.5px;font-weight:500;color:#B9C6D6;font-variant-numeric:tabular-nums}
  #pick .foot{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:10px;
    color:#4C5563;letter-spacing:1px;border-top:1px solid #232C39;padding-top:11px}
  #pick .foot a{color:#5F6B7C;text-decoration:none;cursor:pointer}
  #pick .foot a:hover{color:#F0C674}
  #pick .note{position:absolute;left:clamp(14px,2vw,24px);right:clamp(14px,2vw,24px);
    bottom:clamp(10px,1.6vh,16px);z-index:5;display:none;padding:12px 14px;
    border:1px solid #232C39;border-radius:11px;background:rgba(9,13,19,.96);
    font-size:11px;line-height:1.75;color:#9AA7B7}
  #pick .note.show{display:block}
  #pick .note b{color:#C6D2E0}
  #pick .note h4{font-size:11.5px;color:#F0C674;font-weight:500;letter-spacing:1.5px;margin:0 0 5px}
  #pick .note code{color:#7FD3F0;font-family:ui-monospace,Consolas,monospace;font-size:10px}

  #home-scene{position:relative;overflow:hidden;
    background:
      radial-gradient(1px 1px at 22% 31%,rgba(255,255,255,.5),transparent),
      radial-gradient(1px 1px at 68% 12%,rgba(255,255,255,.35),transparent),
      radial-gradient(1.5px 1.5px at 84% 66%,rgba(160,200,255,.4),transparent),
      radial-gradient(1px 1px at 41% 82%,rgba(255,255,255,.3),transparent),
      radial-gradient(circle at 62% 46%,#0E1522 0%,#070A10 58%,#04060A 100%)}
  #home-scene::after{content:"";position:absolute;inset:-10%;pointer-events:none;
    background:radial-gradient(circle at 50% 50%,transparent 42%,rgba(3,5,9,.82) 100%)}
  #home-ship-host{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    padding:2.5vh 2vw}
  /* SVG 自带 viewBox + preserveAspectRatio：给满容器让它自己等比内缩，任何窗口比例都不裁切 */
  #home-ship{position:relative;width:100%;height:100%;opacity:.92;
    animation:hdrift 34s ease-in-out infinite alternate}
  @keyframes hdrift{from{transform:scale(1)}to{transform:scale(1.035)}}
  #home-ship .corr{fill:none;stroke:#16202C;stroke-linecap:butt}
  #home-ship .room{fill:#0B1119;stroke:#2A3A4C;stroke-width:.22;
    transition:fill .35s,stroke .35s,opacity .35s}
  #home-ship .room.dark{fill:#080D14}
  #home-ship .cover{fill:#1A2431;opacity:.85;transition:fill .35s,opacity .35s}
  #home-ship .pt{fill:#4A5666;transition:fill .35s}
  #home-ship .pt.hard{fill:#6C7A8C}
  #home-ship .pipe{fill:none;stroke:#26424E;stroke-width:.3;transition:stroke .35s}
  #home-ship .rlabel{fill:#46536A;font-size:1.55px;letter-spacing:.18px;text-anchor:middle;
    font-weight:500;transition:fill .35s,opacity .35s}
  #home-ship.hl .room{fill:#090E15;stroke:#1B2431;opacity:.34}
  #home-ship.hl .rlabel{fill:#2A3341;opacity:.32}
  #home-ship.hl .room.on{fill:#13202B;stroke:var(--acc);stroke-width:.34;opacity:1;
    filter:drop-shadow(0 0 .7px var(--acc))}
  #home-ship.hl .rlabel.on{fill:var(--acc);opacity:.95}
  #home-ship.hl .cover.on{fill:var(--acc);opacity:.42}
  #home-ship.hl .pt.on{fill:var(--acc)}
  #home-ship.hl .pipe.on{stroke:var(--acc);stroke-width:.42}
  #home-torch{position:absolute;inset:0;pointer-events:none;mix-blend-mode:screen;
    background:radial-gradient(circle 220px at var(--mx,60%) var(--my,45%),
      rgba(150,215,255,.20),rgba(110,180,235,.07) 45%,transparent 72%)}

  /* ---------------- 对局复盘（结束页与开始页共用） ---------------- */
  #replay{position:fixed;inset:0;z-index:10005;display:flex;align-items:center;justify-content:center;
    background:rgba(6,8,12,.9);backdrop-filter:blur(3px);
    font-family:system-ui,"Microsoft YaHei",sans-serif;color:#DDE3EC}
  #replay.hide{display:none}
  #replay .rp-card{background:#12161E;border:1px solid #2A3240;border-radius:14px;padding:18px 20px;
    width:min(1220px,96vw);max-height:94vh;overflow:auto}
  #replay h2{margin:0 0 4px;font-size:16px;font-weight:500;color:#fff}
  #replay .sub{color:#7C8798;font-size:12px;margin-bottom:10px}
  #replay button{background:#1D2530;color:#DDE3EC;border:1px solid #313B4B;border-radius:8px;
    padding:8px 14px;font-size:13px;cursor:pointer;font-family:inherit}
  #replay button:hover{background:#26313F;border-color:#43536B}
  #replay button.p{background:#2A4A6B;border-color:#3C6690}
  .rp-grid{display:grid;grid-template-columns:minmax(0,1.12fr) minmax(330px,.88fr);
    gap:14px;height:min(62vh,600px)}
  .rp-map{position:relative;border:1px solid #1F2733;border-radius:10px;overflow:hidden;
    background:radial-gradient(circle at 50% 45%,#0C131C,#05080D 72%)}
  .rp-ship{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    padding:8px}
  .rp-ship svg{width:100%;height:100%;opacity:.95}
  .rp-ship .corr{fill:none;stroke:#16202C;stroke-linecap:butt}
  .rp-ship .room{fill:#0B1119;stroke:#2A3A4C;stroke-width:.22}
  .rp-ship .room.dark{fill:#080D14}
  .rp-ship .room.on{fill:#16273A;stroke:#7FD3F0;stroke-width:.36}
  .rp-ship .cover{fill:#1A2431;opacity:.85}
  .rp-ship .pt{fill:#4A5666}
  .rp-ship .pt.hard{fill:#6C7A8C}
  .rp-ship .pipe{fill:none;stroke:#26424E;stroke-width:.3}
  .rp-ship .rlabel{fill:#46536A;font-size:1.55px;text-anchor:middle;font-weight:500}
  .rp-dot{stroke:#05080D;stroke-width:.16}
  .rp-dot.hum{fill:#8FD3F0}
  .rp-dot.ali{fill:#E0574F}
  .rp-dot.dead{opacity:.5}
  .rp-dot.down{stroke:#F0C674;stroke-width:.26}
  .rp-dot.me{stroke:#FFFFFF;stroke-width:.32}
  .rp-hit{fill:none;stroke:#F0C674;stroke-width:.3}
  .rp-side{display:flex;flex-direction:column;min-width:0;border:1px solid #1F2733;
    border-radius:10px;background:#0D121A;overflow:hidden}
  .rp-meta{padding:10px 12px;border-bottom:1px solid #1F2733;font-size:11.5px;line-height:1.7;
    color:#93A1B3;flex:0 0 auto}
  .rp-meta b{color:#F0C674;font-weight:500}
  .rp-meta .hum{color:#8FD3F0}
  .rp-meta .ali{color:#E0574F}
  .rp-filters{display:flex;flex-wrap:wrap;gap:5px;padding:8px 10px;border-bottom:1px solid #1F2733;
    flex:0 0 auto}
  .rp-filters button{padding:3px 8px;font-size:10.5px;border-radius:20px;border-color:#232C39;
    color:#8A94A3}
  .rp-filters button.on{border-color:#F0C674;color:#F0C674;background:#1D1A12}
  .rp-list{flex:1;overflow:auto;padding:4px 0}
  .rp-ev{display:grid;grid-template-columns:62px 16px 1fr;gap:7px;align-items:start;
    padding:5px 12px;font-size:11.5px;line-height:1.55;color:#AEB9C7;cursor:pointer;
    border-left:2px solid transparent}
  .rp-ev:hover{background:#141C26}
  .rp-ev.on{background:#18222E;border-left-color:#F0C674}
  .rp-ev .tm{color:#5F6B7C;font-variant-numeric:tabular-nums;font-size:10.5px;white-space:nowrap}
  .rp-ev .ic{text-align:center;opacity:.9}
  .rp-ev b{color:#E4EAF2;font-weight:500}
  .rp-ev .rm{color:#7FD3F0}
  .rp-ev .vd{color:#E0574F}
  .rp-empty{padding:18px;text-align:center;color:#5F6B7C;font-size:11.5px}
  .rp-bar{display:flex;align-items:center;gap:10px;margin-top:12px}
  .rp-bar input[type=range]{flex:1;accent-color:#F0C674;min-width:80px}
  .rp-bar #rp-time{min-width:64px;text-align:right;color:#8A94A3;font-size:11.5px;
    font-variant-numeric:tabular-nums}
  @media (max-width:880px){
    .rp-grid{grid-template-columns:1fr;grid-template-rows:minmax(220px,1fr) minmax(180px,.9fr);
      height:min(70vh,720px)}
  }

  /* 设置面板 / 竖屏提示（保持原样） */
  #settings{position:fixed;inset:0;z-index:10010;display:flex;align-items:center;justify-content:center;
    background:rgba(6,8,12,.88);backdrop-filter:blur(2px)}
  #settings.hide{display:none}
  #settings .sc{background:#12161E;border:1px solid #2A3240;border-radius:14px;padding:22px 26px;
    min-width:min(420px,90vw);color:#DDE3EC;font-family:system-ui,"Microsoft YaHei",sans-serif}
  #settings h2{margin:0 0 4px;font-size:16px;font-weight:500;color:#fff}
  #settings .ss{color:#7C8798;font-size:12px;margin-bottom:16px}
  #settings .sr{display:flex;align-items:center;gap:12px;padding:9px 0;border-top:1px solid #1F2733;font-size:13px}
  #settings .sr span{width:46px;color:#8A94A3}
  #settings .sr input{flex:1;accent-color:#F0C674}
  #settings .sr b{width:34px;text-align:right;color:#F0C674;font-weight:500;font-variant-numeric:tabular-nums}
  #settings .sbtns{margin-top:18px;display:flex;gap:10px;flex-wrap:wrap}
  #settings button{background:#1D2530;color:#DDE3EC;border:1px solid #313B4B;border-radius:8px;
    padding:8px 14px;font-size:13px;cursor:pointer;font-family:inherit}
  #settings button:hover{background:#26313F;border-color:#43536B}
  #settings button.p{background:#2A4A6B;border-color:#3C6690}
  #rotate{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;
    background:#05070B;color:#F0C674;font-size:15px;text-align:center;line-height:2}
  @media (orientation:portrait) and (max-width:900px){ #rotate{display:flex} }
  @media (max-width:880px){
    #pick{grid-template-columns:1fr;grid-template-rows:auto 1fr}
    #pick .panel{border-right:none;border-bottom:1px solid #232C39}
    #home-scene{min-height:38vh}
  }
</style>
</head>
<body>
<div id="pick">
  <section class="panel">
    <div class="brand">
      <div class="mark"><i></i>RETURN LOG · 试玩版 · 返航录V3</div>
      <h1>新 返 航 录</h1>
      <p class="sub">同一艘船上，<b>11 名人类</b>与 <b>4 名异形</b>共处。
        白天在会议桌前凭证据投票，夜里在手电照不到的地方被出刀。
        修满 <b>45 分</b>返航，或者一个人都回不去。</p>
    </div>

    <div class="roles" id="home-roles">
      <button class="role sel" style="--acc:#8FA6C0" data-role="human">
        <i class="dot"></i>
        <span><b>人 类</b><span>做任务推维修进度 · 搜尸取证 · 会议上投票</span></span>
        <span class="where">26 个任务点</span>
      </button>
      <button class="role" style="--acc:#E0574F" data-role="alien">
        <i class="dot"></i>
        <span><b>异 形</b><span>出刀 · 钻管道 · 破坏舱室 · 伪装成人在开会</span></span>
        <span class="where">6 个管道口</span>
      </button>
      <button class="role" style="--acc:#7FD3F0" data-role="spect">
        <i class="dot"></i>
        <span><b>旁观者</b><span>第 16 人：全知视角的高速幽灵，不参与对局</span></span>
        <span class="where">中央会议室</span>
      </button>
    </div>

    <div class="cta">
      <button class="go" id="home-go">进 入 舱 段</button>
      <button class="ghost" data-home-info="rules">玩法说明</button>
      <button class="ghost" id="btn-settings">设 置</button>
    </div>

    <div class="stats" id="home-stats"></div>

    <div class="foot">
      <span>file:// 双击即玩 · 零依赖 · 无构建</span>
      <span><a data-home-info="ship">这块船体是真的</a> · <a id="home-replay">载入回放</a> ·
        <span data-version>返航录V3</span></span>
    </div>
    <input id="home-replay-file" type="file" accept=".json,application/json" hidden>

    <div class="note" id="home-note"></div>
  </section>

  <section id="home-scene">
    <div id="home-ship-host"></div>
    <div id="home-torch"></div>
  </section>
</div>

<div id="settings" class="hide"><div class="sc">
  <h2>设置</h2><div class="ss">音量与对局控制 · 自动保存在本机</div>
  <div class="sr"><span>音乐</span><input id="set-music" type="range" min="0" max="100" step="1" value="35"><b id="set-music-v">35</b></div>
  <div class="sr"><span>音效</span><input id="set-sfx" type="range" min="0" max="100" step="1" value="80"><b id="set-sfx-v">80</b></div>
  <div class="sbtns">
    <button class="p" id="set-close">继续</button>
    <button id="set-pause">暂停游戏</button>
    <button id="set-exit">退出到开始页</button>
  </div>
</div></div>
<audio id="bgm" src="audio/music-bgm.m4a" loop preload="auto"></audio>
<div id="rotate">请横屏使用</div>

<div id="replay" class="hide"><div class="rp-card">
  <h2 id="rp-t">对局复盘</h2><div class="sub" id="rp-sub"></div>
  <div class="rp-grid">
    <div class="rp-map"><div class="rp-ship" id="rp-ship-host"></div></div>
    <div class="rp-side">
      <div class="rp-meta" id="rp-meta"></div>
      <div class="rp-filters" id="rp-filters"></div>
      <div class="rp-list" id="rp-list"></div>
    </div>
  </div>
  <div class="rp-bar">
    <button class="p" id="rp-play">播放</button>
    <input id="rp-seek" type="range" min="0" max="0" step="1" value="0">
    <span id="rp-time">0.0s</span>
    <button id="rp-save">保存回放</button>
    <button id="rp-close">关闭</button>
  </div>
</div></div>

<link rel="preload" as="image" href="assets/scene/v4/base-lit.png">
<link rel="preload" as="image" href="assets/scene/v4/hull-deck.png">
<!-- 加载顺序即依赖顺序：版本 → 数据 → 模板 → 引擎 → 对局 → 入口 → 主页 → 复盘 -->
<script src="js/config/version.js"></script>
<script src="js/data/map.js"></script>
<script src="js/ui/templates.js"></script>
<script src="js/engine/clock.js"></script>
<script src="js/engine/invariants.js"></script>
<script src="js/engine/geo.js"></script>
<script src="js/game.js"></script>
<script src="js/main.js"></script>
<script src="js/ui/home.js"></script>
<script src="js/ui/replay.js"></script>
</body>
</html>
