# ===== GitHub Actions — Cloudflare Pages 部署（太空杀 · 网页版）=====
# 触发：push 到 main（或手动 workflow_dispatch）
# 说明：本站是纯静态前端（单机可玩）。联机模式依赖 server/server.js 的 WebSocket，
#       不属于 Cloudflare Pages 的能力范围，故不在本流水线内。
# ★ 部署源是白名单暂存目录（tools/deploy-pages.cjs 的 SITE_ENTRIES），
#   绝不能 pages deploy . 整仓直推：仓库根含 node_modules/、docs/、tools/、
#   attachment-site/（12.6MB 附件站全套）等非站点内容，配了 secret 就会被公开。
# 依赖 GitHub Secrets（缺任一则跳过部署，流水线保持绿）：
#   CF_API_TOKEN    Cloudflare API Token（需含 Pages:Edit 权限）
#   CF_ACCOUNT_ID   Cloudflare 账户 ID

name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Syntax check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Syntax check all JS
        run: |
          find js server tools -name '*.js' -print0 | xargs -0 -n1 node --check
          node --check server/server.js 2>/dev/null || true

      - name: Unit / language / UI smoke / simulation
        run: |
          node tools/test-fix-v26.cjs
          node tools/test-lang.cjs
          node tools/uismoke.cjs
          node tools/sim.cjs 60

      # 〔2026-10-26 批 P0-a〕站点白名单门禁。
      # 守的是「代码引用的 assets/ 必须落在上传白名单内」——
      # 线上 /assets/** 曾经全 404（云端回退成 index.html），网页版所有场景图/头像/背景不显示，
      # 而 smoke-test 只 curl / 与 /js/main.js，因此一直是绿的。这条断言在主库侧先拦。
      - name: Site whitelist gate
        run: node tools/test-site-entries.cjs

      # 同一批：暂存内容必须真的含 assets（模拟 deploy 的复制步骤，不上传）
      - name: Deploy staging includes assets (dry-run)
        run: |
          node tools/deploy-pages.cjs --dry-run | tee /tmp/stage.txt
          grep -q '^  assets ' /tmp/stage.txt || { echo '✗ 暂存内容不含 assets，上线后场景图会全 404'; exit 1; }

  deploy-pages:
    name: Cloudflare Pages (production)
    needs: check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check deploy secrets
        id: secrets
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          if [ -z "$CF_API_TOKEN" ] || [ -z "$CF_ACCOUNT_ID" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "⚠ CF_API_TOKEN / CF_ACCOUNT_ID 未配置，跳过部署（仓库仍可正常拉取）"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Pull SpaceKill.apk from GitHub Release
        # APK 被 .gitignore 排除（不进 git）。部署清单里的可选条目由本步拉回仓库根；
        # Release 即安装包分发源，与 releases/latest 稳定链接同一份文件。
        run: |
          curl -fsSL --retry 3 -o SpaceKill.apk \
            "https://github.com/${{ github.repository }}/releases/latest/download/SpaceKill.apk"

      - name: Deploy via whitelist staging (tools/deploy-pages.cjs)
        if: steps.secrets.outputs.present == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          WRANGLER_CMD: npx wrangler@4
        run: node tools/deploy-pages.cjs

  smoke-test:
    name: Post-deploy smoke test
    needs: deploy-pages
    if: needs.deploy-pages.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: 首页可达
        run: curl -fsSL -o /dev/null --max-time 30 "https://space-kill-web.pages.dev/"

      - name: 核心脚本可达
        run: curl -fsSL -o /dev/null --max-time 30 "https://space-kill-web.pages.dev/js/main.js"

      # 〔2026-10-26 批 P0-a〕产物级冒烟：场景图必须是**真图片**。
      # 这正是上一版漏掉的那一条：/assets/** 未上传时云端回退成 index.html(26201B, text/html)，
      # 返回码是 200，只 curl 状态码永远发现不了。故这里同时校验 Content-Type 与首字节。
      - name: 场景图必须是真 PNG（防 SPA 回退）
        run: |
          set -e
          for p in \
            "assets/scene/cozy/tiles/floor-lab.png" \
            "assets/scene/cozy/furniture/table.png" \
            "assets/scene/bg/spaceship-interior-1600.jpg"
          do
            url="https://space-kill-web.pages.dev/$p"
            ct=$(curl -fsSL -o /tmp/x -w '%{content_type}' --max-time 60 "$url")
            size=$(wc -c < /tmp/x)
            head4=$(head -c 4 /tmp/x | od -An -tx1 | tr -d ' \n')
            echo "$p : $ct  $size B  head=$head4"
            case "$p" in
              *.png) [ "$ct" = "image/png" ]              || { echo "✗ $p Content-Type 不是 image/png（疑似 SPA 回退成 HTML）"; exit 1; };;
              *.jpg) [ "$ct" = "image/jpeg" ]             || { echo "✗ $p Content-Type 不是 image/jpeg"; exit 1; };;
            esac
            [ "$size" -gt 500 ] || { echo "✗ $p 体积异常小：$size B（多半是 HTML 回退）"; exit 1; }
          done
          echo "✓ 场景素材全部为真图片"

      - name: 角色头像可达（SVG）
        run: |
          ct=$(curl -fsSL -o /tmp/y -w '%{content_type}' --max-time 60 \
            "https://space-kill-web.pages.dev/assets/scene/characters/a-crew/seat-01.svg")
          echo "seat-01.svg : $ct"
          [ "$ct" = "image/svg+xml" ] || { echo "✗ 头像 Content-Type 不是 image/svg+xml"; exit 1; }

  # ===== 附件站（space-kill.pages.dev）=====
  # 为什么单列一个 job：附件站是**另一个** Pages 项目，产物在 attachment-site/site/，
  # 与游戏站白名单（tools/deploy-pages.cjs 的 SITE_ENTRIES）互不重叠。
  # 2026-10-21 之前这一步是手动 `wrangler pages deploy`，已因此漏发过三份规则 PDF
  # （线上返回 text/html 的 SPA 回退，而仓库里文件齐全）。现纳入 CI，杜绝「提交了但没上线」。
  deploy-attachment:
    name: Cloudflare Pages (attachment site)
    needs: check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check deploy secrets
        id: secrets
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          if [ -z "$CF_API_TOKEN" ] || [ -z "$CF_ACCOUNT_ID" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "⚠ CF_API_TOKEN / CF_ACCOUNT_ID 未配置，跳过附件站部署"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      # 门禁：site/ 必须是**由源确定性重建**的产物。构建输入是 规则正文/*.md 与 剧情/*.docx，
      # 若有人手改了 site/ 而没跑构建，这里会失败——防的是「产物与源分叉」。
      - name: 校验 site/ 由源重建一致
        run: |
          python3 -m pip install --quiet python-docx==1.2.0 pdfplumber
          cp -r attachment-site/site /tmp/site-before
          (cd attachment-site && python3 tools/build_site.py)
          diff -r /tmp/site-before attachment-site/site \
            && echo "✓ site/ 与重建结果一致" \
            || { echo "✗ site/ 与源重建结果不一致：请本地跑 python tools/build_site.py 后提交"; exit 1; }

      - name: 部署附件站（wrangler pages deploy site）
        if: steps.secrets.outputs.present == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
        run: |
          cd attachment-site
          npx wrangler@4 pages deploy site \
            --project-name=space-kill \
            --branch=main \
            --commit-dirty=true

  # ===== 附件站部署后冒烟 =====
  smoke-test-attachment:
    name: Attachment site smoke test
    needs: deploy-attachment
    if: needs.deploy-attachment.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: 首页可达
        run: curl -fsSL -o /dev/null --max-time 30 "https://space-kill.pages.dev/"

      - name: 规则在线阅读可达
        run: curl -fsSL -o /dev/null --max-time 30 "https://space-kill.pages.dev/rules.html"

      # 关键：PDF 必须是 application/pdf 且首字节为 %PDF —— 2026-10-21 正是这里
      # 返回了 text/html 的 SPA 回退（23397 B），才发现附件站没部署。
      - name: 四份规则 PDF 必须是真 PDF
        run: |
          set -e
          for name in 正文 职业速查卡 术语表 判定流程图; do
            url="https://space-kill.pages.dev/返航录三阵营对抗规则·${name}v1preview1.0.pdf"
            ct=$(curl -fsSL -o /tmp/x.pdf -w '%{content_type}' --max-time 60 "$url")
            head4=$(head -c 4 /tmp/x.pdf)
            size=$(wc -c < /tmp/x.pdf)
            echo "$name: $ct  $size B  head=$head4"
            [ "$ct" = "application/pdf" ] || { echo "✗ $name 的 Content-Type 不是 application/pdf"; exit 1; }
            [ "$head4" = "%PDF" ] || { echo "✗ $name 首字节不是 %PDF（疑似 SPA 回退）"; exit 1; }
            [ "$size" -gt 100000 ] || { echo "✗ $name 体积异常小：$size B"; exit 1; }
          done
          echo "✓ 四份 PDF 全部为真 PDF"
  # ===== 失败通知：创建/关闭 Issue =====
  # 背景：2026-10-23 乒乓站点 CI 失败后未部署，站点静默停在旧版一天无人发现。
  # 工作流失败时自动开 Issue（带失败 job/提交/链接），成功后自动关闭，
  # 让「部署挂了」在 GitHub 站内可见，不依赖容易被忽略的邮件。无需外部凭据。
  close-failure-issue:
    name: Close stale failure issue
    if: success()
    needs: [check, deploy-pages, smoke-test, deploy-attachment, smoke-test-attachment]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Close open deploy-failure issues
        uses: actions/github-script@v8
        with:
          script: |
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'deploy-failure',
            });
            for (const issue of open.data) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issue.number,
                body: `已恢复：${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issue.number, state: 'closed',
              });
              core.info(`已关闭 #${issue.number}`);
            }

  notify:
    name: Notify on failure
    if: always() && contains(needs.*.result, 'failure')
    needs: [check, deploy-pages, smoke-test, deploy-attachment, smoke-test-attachment]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open or update failure issue
        uses: actions/github-script@v8
        with:
          script: |
            const results = ${{ toJSON(needs) }};
            const failed = Object.entries(results)
              .filter(([, v]) => v.result === 'failure')
              .map(([k]) => k);
            const title = `部署失败：${context.workflow}（${context.ref_name}）`;
            const body = [
              `**工作流**：${context.workflow}`,
              `**分支**：${context.ref_name}`,
              `**失败 job**：${failed.join('、') || '（未知）'}`,
              `**提交**：${context.sha.slice(0, 7)}`,
              `**运行记录**：${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              '> 处理完成后本 Issue 会在下次成功部署时自动关闭。',
            ].join('\n');

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'deploy-failure',
            });
            if (existing.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.data[0].number, body,
              });
              core.info(`已追加评论到 #${existing.data[0].number}`);
            } else {
              const created = await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['deploy-failure'],
              });
              core.info(`已创建 Issue #${created.data.number}`);
            }